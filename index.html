<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Loading...</title>
</head>
<body style="background:#000;">

    <script>
        // 1. Immediately launch the pristine blank puzzle workspace
        const puzzleWindow = window.open('about:blank', '_blank');

        // 2. Build the Morse interface environment to inject into the blank document
        const secretContent = `
        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>...</title>
            <style>
                body { margin: 0; padding: 0; background-color: #000000; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: sans-serif; }
                .input-container { text-align: center; }
                .puzzle-input { background-color: #000000; color: #ffffff; border: 2px solid #ffffff; padding: 15px 25px; font-size: 20px; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; outline: none; border-radius: 4px; width: 300px; text-align: center; }
            </style>
        </head>
        <body>
            <div class="input-container">
                <input type="text" id="puzzleBox" class="puzzle-input" placeholder="..." autofocus autocomplete="off">
            </div>
            <script>
                // Flash Morse sequence for B E G I N N I N G inside the about:blank tab title
                const seq = ["-...", ".", "--.", "..", "-.", "-.", "..", "-.", "--."];
                seq.forEach((char, idx) => {
                    setTimeout(() => { document.title = char; }, idx * 1000);
                });
                
                // When finished, the tab name goes completely blank using a hidden Unicode marker
                setTimeout(() => { document.title = "\\u200e"; }, seq.length * 1000);

                // Input authentication layer
                document.getElementById('puzzleBox').addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        const val = this.value.trim().toUpperCase();
                        if (val === "BEGINNING") {
                            alert("Good Luck.");
                            // Next stage routing will go here
                        } else {
                            this.value = ""; // Clear on failure
                        }
                    }
                });
            <\/script>
        </body>
        </html>
        `;

        // 3. Inject the logic and assets straight into the window
        puzzleWindow.document.open();
        puzzleWindow.document.write(secretContent);
        puzzleWindow.document.close();

        // 4. Instantly kill this generator tab so only the blank one stays active
        window.close();
    </script>

</body>
</html>
